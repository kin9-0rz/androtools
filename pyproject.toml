
[project]
name = "androtools"
version = "1.0.9"
description = "一个对Android SDK相关的命令封装的库"
authors = [{ name = "kin9-0rz", email = "kin9-0rz@outlook.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["func-timeout>=4.3.5", "loguru>=0.7.3", "psutil>=7.1.3"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "twine>=6.2.0",
]

[project.scripts]
androtools = "androtools.__main__:main"


[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"
