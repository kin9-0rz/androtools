
[project]
name = "androtools"
version = "2.2.1"
description = "对Android SDK、第三方模拟器命令行工具、以及通过adb连接的Android设备的封装"
authors = [{ name = "kin9-0rz", email = "kin9-0rz@outlook.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["func-timeout>=4.3.5", "loguru>=0.7.3", "psutil>=7.1.3"]

# classifiers 是 shields 那两个徽章的唯一数据源：`pypi/status` 只读 Development Status，
# `pypi/pyversions` 只读 `Programming Language :: Python :: 3.x`（没有 requires-python
# 回退 —— shields PR #5592 至今没合）。改这一段不会立刻见效：徽章读的是 PyPI 上**最新
# 已发布版本**的元数据，所以每次动它都得发一个新版本。
#
# 故意不加的两类：
#   - `License :: ...` —— PEP 639 已弃用它，原文是 "New license classifiers MUST NOT be
#     added to PyPI"；本包用 SPDX 表达式（license = "MIT"），再加它会让 setuptools
#     之类的后端直接报错。`pypi/l` 徽章读 license_expression，本来就是对的。
#   - `Typing :: Typed` —— PEP 561 要求包里带 py.typed，本包没有。
#
# 版本范围与 .github/workflows/ci.yml 的 matrix 必须一致：声明支持某个版本却从不
# 在那儿跑它，等于没有承诺。
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=9.0.2",
    "twine>=6.2.0",
]

[tool.mypy]
python_version = "3.10"
files = ["src/androtools", "tests"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "integration: 需要真实 Android SDK 或已连接的设备",
]
# 默认排除 integration：这些测试在没有 SDK 的机器上必然失败，会淹没单元测试的信号。
# 命令行上再写一次 -m 会覆盖这里，所以 `pytest -m integration` 仍然可用。
addopts = '-m "not integration"'

[build-system]
# 上限是 uv 自己要求的（没有上限它会警告 sdist 不可复现），但要覆盖当前 uv 版本 ——
# 之前的 <0.10.0 就是因为不含 0.12 而被警告。uv 发新版时这里需要跟着抬。
requires = ["uv-build>=0.9.17,<0.13"]
build-backend = "uv_build"
